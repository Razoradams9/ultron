<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON A.I.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0403;            /* near-black with a red undertone */
    --panel: rgba(30, 10, 8, .55);
    --line: rgba(255, 110, 60, .30);
    --line-dim: rgba(255, 110, 60, .13);
    --ember: #ff6a2c;           /* primary hot orange */
    --ember-hot: #ffb27a;       /* highlight */
    --crimson: #ff2d1a;         /* menacing red */
    --text: #ffd9c4;
    --fog: #b8887a;
    --grad: linear-gradient(90deg, #ff9a3c, #ff2d00);
    --mono: "DM Sans", "Consolas", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--void); color: var(--text);
    font-family: var(--mono); font-weight: 400; font-size: 15px;
    overflow: hidden;
  }

  /* blueprint grid + vignette */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(rgba(230,110,60,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230,110,60,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(120% 120% at 50% 40%, #000 30%, transparent 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(110% 110% at 50% 45%, transparent 52%, rgba(0,0,0,.62) 100%);
  }

  /* ── HUD frame ─────────────────────────────────── */
  #hud {
    position: fixed; inset: 14px; z-index: 1;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(30, 8, 4, .9), 0 0 48px rgba(180, 40, 10, .20) inset;
    display: flex; flex-direction: column;
  }
  .bracket { position: absolute; width: 26px; height: 26px; pointer-events: none; }
  .bracket.tl { top: -3px; left: -3px; border-top: 2px solid var(--ember); border-left: 2px solid var(--ember); }
  .bracket.tr { top: -3px; right: -3px; border-top: 2px solid var(--ember); border-right: 2px solid var(--ember); }
  .bracket.bl { bottom: -3px; left: -3px; border-bottom: 2px solid var(--ember); border-left: 2px solid var(--ember); }
  .bracket.br { bottom: -3px; right: -3px; border-bottom: 2px solid var(--ember); border-right: 2px solid var(--ember); }
  .pixels {
    position: absolute; width: 90px; height: 10px; pointer-events: none; opacity: .8;
    background-image: repeating-linear-gradient(90deg, var(--ember) 0 3px, transparent 3px 6px);
  }
  .pixels.a { top: -16px; left: 8px; }
  .pixels.b { bottom: -16px; right: 8px; }

  /* ── title bar ─────────────────────────────────── */
  #topbar {
    height: 44px; flex: none; display: flex; align-items: stretch;
    border-bottom: 1px solid var(--line-dim);
  }
  #titlebar {
    display: flex; align-items: center; gap: 10px;
    background: var(--grad); color: #1a0500;
    font-weight: 500; letter-spacing: 2.5px; font-size: 14px;
    padding: 0 18px; flex: none;
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }
  #topbar .meta {
    display: flex; align-items: center; gap: 18px; margin-left: auto;
    padding-right: 16px; font-size: 12px; letter-spacing: 1.6px; color: var(--fog);
  }
  #topbar .meta b { color: var(--ember); font-weight: 400; }
  .sysdot { width: 7px; height: 7px; border-radius: 50%; background: #5a2a20; display: inline-block; margin-right: 6px; }
  .sysdot.on { background: var(--ember); box-shadow: 0 0 8px var(--ember); }

  /* ── stage ─────────────────────────────────────── */
  #stage { position: relative; flex: 1; min-height: 0; }
  #entity { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* vitals chip — top right */
  #vitals {
    position: absolute; top: 14px; right: 14px; width: 230px;
    background: var(--panel); border: 1px solid var(--line-dim);
    padding: 12px 14px; backdrop-filter: blur(4px);
    clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
  }
  #vitals h3 { font-size: 10px; letter-spacing: 2.2px; color: var(--fog); margin-bottom: 8px; font-weight: 400; }
  #vitals .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--fog); margin: 3px 0; }
  #vitals .row b { color: var(--text); font-weight: 400; font-variant-numeric: tabular-nums; }
  #vitals .bar { height: 3px; background: rgba(255,110,60,.12); margin: 3px 0 7px; }
  #vitals .bar i { display: block; height: 100%; width: 0%; background: var(--ember); box-shadow: 0 0 6px var(--ember); transition: width .6s ease; }

  /* chat log — bottom left overlay */
  #log {
    position: absolute; left: 16px; bottom: 84px; width: min(520px, 55%);
    max-height: 62%; overflow-y: auto; padding: 6px 10px 6px 2px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 100%);
  }
  .msg { margin-bottom: 16px; }
  .msg .who { font-size: 10px; letter-spacing: 2.4px; color: var(--fog); margin-bottom: 4px; }
  .msg.ultron .who { color: var(--ember); }
  .msg .body { font-size: 15px; line-height: 1.55; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { color: #d8a894; }
  .msg.ultron .body { color: var(--ember-hot); text-shadow: 0 0 14px rgba(255, 90, 40, .30); }
  .msg.error .body {
    color: #ffb08a; font-size: 13px; padding: 10px 12px;
    background: rgba(70, 16, 6, .45); border-left: 2px solid var(--crimson);
  }
  .tool { font-size: 11px; letter-spacing: .8px; color: var(--fog); margin-bottom: 10px; }
  .tool b { color: var(--ember); font-weight: 400; }
  .cursor { display: inline-block; width: 8px; height: 14px; margin-left: 2px; background: var(--ember);
            vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── console strip ─────────────────────────────── */
  #console {
    flex: none; display: flex; gap: 10px; align-items: center;
    padding: 14px 16px; border-top: 1px solid var(--line-dim);
    background: rgba(24, 8, 5, .6);
  }
  .tag {
    flex: none; font-size: 10px; letter-spacing: 2px; color: var(--fog);
    border: 1px solid var(--line-dim); padding: 9px 12px;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    background: transparent; font-family: var(--mono); cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .tag:hover { color: var(--text); border-color: var(--line); }
  #mic.rec { color: var(--crimson); border-color: var(--crimson); background: rgba(90, 18, 6, .4); animation: micpulse 1s ease-in-out infinite; }
  @keyframes micpulse { 50% { box-shadow: 0 0 14px rgba(255, 60, 30, .55); } }
  #spk.on, #cloneBtn.on { color: var(--ember); border-color: var(--ember); background: rgba(70, 24, 8, .4); }
  #input {
    flex: 1; background: rgba(26, 9, 5, .7); border: 1px solid var(--line-dim);
    color: var(--ember-hot); font-family: var(--mono); font-size: 15px;
    padding: 11px 14px; outline: none;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
  }
  #input::placeholder { color: var(--fog); }
  #input:focus { border-color: var(--ember); box-shadow: 0 0 14px rgba(255, 90, 40, .18) inset; }
  #send {
    flex: none; background: var(--grad); border: none; color: #1a0500;
    font-family: var(--mono); font-weight: 500; letter-spacing: 2px; font-size: 13px;
    padding: 12px 26px; cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: filter .15s ease;
  }
  #send:hover { filter: brightness(1.18); }
  #send:disabled { filter: saturate(.25) brightness(.55); cursor: default; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,110,60,.22); }
  @media (prefers-reduced-motion: reduce) { #entity { display: none; } }

  /* ── orb toggle (mobile only) ───────────────────────────────────
     A small button to hide the background orb and reclaim screen for
     the chat log. Hidden on desktop where there's room for both. */
  #orbToggle { display: none; }

  /* ── mobile / phone layout ─────────────────────────────────────
     The dashboard is desktop-first; on a narrow screen the panels
     overlap. Stack them, shrink the orb, and make the console tappable. */
  @media (max-width: 720px) {
    body { font-size: 14px; }
    /* let the page scroll if the on-screen keyboard squeezes the layout */
    body { overflow: auto; }
    #hud { inset: 6px; }
    #topbar { height: auto; min-height: 40px; flex-wrap: wrap; }
    #titlebar { font-size: 12px; letter-spacing: 1.5px; padding: 6px 12px; }
    #topbar .meta { gap: 10px; font-size: 10px; letter-spacing: 1px;
      padding: 4px 10px 4px 0; flex-wrap: wrap; }

    /* vitals: a slim single-row strip pinned top-right, not a tall chip that
       collides with the chat. Bars hidden to save vertical space. */
    #vitals {
      width: auto; top: 6px; right: 6px; left: auto; padding: 6px 9px;
      display: flex; gap: 12px; align-items: center;
    }
    #vitals h3 { display: none; }
    #vitals .bar { display: none; }
    #vitals .row { display: inline-flex; gap: 5px; margin: 0; font-size: 10px; }
    #vitals .row span { color: var(--fog); }
    /* OS row is noise on a phone strip */
    #vitals .row:last-of-type { display: none; }

    /* orb sits behind; chat takes the full width, lifted above console */
    #log {
      left: 8px; right: 8px; width: auto; bottom: 8px; top: auto;
      max-height: 52vh;
      background: rgba(10, 4, 3, .55); backdrop-filter: blur(3px);
      border: 1px solid var(--line-dim); padding: 8px 10px;
    }
    .msg { margin-bottom: 12px; }
    .msg .body { font-size: 15px; }
    .msg .who { font-size: 9px; }

    /* orb hide/show control, bottom-right corner of the stage */
    #orbToggle {
      display: block; position: absolute; right: 8px; bottom: 8px; z-index: 3;
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
      color: var(--fog); background: rgba(24, 8, 5, .7);
      border: 1px solid var(--line-dim); padding: 8px 10px; cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    }
    /* when the orb is hidden, chat gets the full stage */
    #stage.no-orb #entity { display: none; }
    #stage.no-orb #log { max-height: 78vh; }

    /* console wraps so input + buttons stay finger-sized */
    #console { flex-wrap: wrap; gap: 8px; padding: 10px; position: sticky; bottom: 0; }
    #input { order: -1; flex: 1 1 100%; font-size: 16px; padding: 12px; }
    .tag { flex: 1 1 0; text-align: center; padding: 12px 6px; font-size: 10px; min-width: 64px; }
    #send { flex: 1 1 100%; padding: 14px; font-size: 14px; }
  }

  /* very small phones: tighten the console labels further */
  @media (max-width: 380px) {
    .tag { letter-spacing: 1px; padding: 12px 4px; }
    #titlebar { letter-spacing: 1px; }
  }
</style>
</head>
<body>
  <div id="hud">
    <i class="bracket tl"></i><i class="bracket tr"></i><i class="bracket bl"></i><i class="bracket br"></i>
    <i class="pixels a"></i><i class="pixels b"></i>

    <header id="topbar">
      <div id="titlebar">ULTRON A.I.</div>
      <div class="meta">
        <span><span id="statusDot" class="sysdot"></span><span id="provText">LINKING</span></span>
        <span>MODEL <b id="modelText">—</b></span>
        <span>MEM <b id="memStat">—</b></span>
      </div>
    </header>

    <div id="stage">
      <canvas id="entity"></canvas>

      <div id="vitals">
        <h3>HOST VITALS</h3>
        <div class="row"><span>CPU</span><b id="cpuPct">—</b></div>
        <div class="bar"><i id="cpuBar"></i></div>
        <div class="row"><span>MEMORY</span><b id="memPct">—</b></div>
        <div class="bar"><i id="memBar"></i></div>
        <div class="row"><span>DISK</span><b id="dskPct">—</b></div>
        <div class="bar"><i id="dskBar"></i></div>
        <div class="row"><span>OS</span><b id="osText">—</b></div>
      </div>

      <div id="log"></div>

      <button id="orbToggle" title="show / hide the orb to give the log more room">HIDE ORB</button>
    </div>

    <div id="console">
      <button id="mic" class="tag" title="voice input (whisper)">MIC</button>
      <input id="input" placeholder="Speak, and it shall be done…" autocomplete="off" autofocus>
      <button id="spk" class="tag" title="toggle spoken replies (local Chatterbox clone, orpheus fallback)">VOICE: OFF</button>
      <input type="file" id="cloneFile" accept="audio/*" hidden>
      <button id="cloneBtn" class="tag" title="upload a voice sample (5-15s clean speech) — cloned locally, never leaves this machine">CLONE</button>
      <button id="send">EXECUTE</button>
    </div>
  </div>

<script>
/* ── the menacing core — Ultron's red eye ───────────────────────
   A glowing crimson orb: a hot inner iris, a breathing bloom, a slow
   rotating ring of embers, and a contracting pupil. It brightens and
   quickens when Ultron is thinking. Frame-capped for remote (tunnel) use. */
const canvas = document.getElementById("entity");
const ctx = canvas.getContext("2d");
// Cap pixel ratio: high-DPI screens otherwise render 2-3x the pixels — the
// main source of jank over a remote (Colab tunnel) connection.
const DPR = Math.min(devicePixelRatio || 1, 1.5);
let W, H, CX, CY;
function resize() {
  W = canvas.width = canvas.offsetWidth * DPR;
  H = canvas.height = canvas.offsetHeight * DPR;
  CX = W / 2; CY = H * 0.5;
}
resize();
addEventListener("resize", resize);

// ring of orbiting embers around the core
const RING = 46;
const embers = [];
for (let i = 0; i < RING; i++) {
  embers.push({
    a: (i / RING) * Math.PI * 2 + Math.random() * 0.1,
    rf: 0.92 + Math.random() * 0.22,     // radius factor off the core
    s: 0.10 + Math.random() * 0.18,      // orbit speed
    sz: 0.7 + Math.random() * 1.4,       // size
    tw: Math.random() * Math.PI * 2,     // twinkle phase
  });
}

let busy = false, t = 0, pulse = 0;

// Frame-rate cap (~30fps): the field is ambient, so half the frames look
// identical but cost half the CPU — a big win on a laggy remote tab.
let _last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - _last < 33) return;
  _last = now;

  const speed = busy ? 0.030 : 0.010;
  t += speed;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";

  const R = Math.min(W, H) * 0.16;             // core radius
  const breathe = 1 + Math.sin(t * 1.6) * 0.05 + pulse;
  const heat = busy ? 1 : 0.82;

  // outer bloom halo
  let g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 3.4 * breathe);
  g.addColorStop(0, `rgba(255, 90, 30, ${0.20 * heat + pulse * 0.5})`);
  g.addColorStop(0.4, `rgba(220, 40, 12, ${0.10 * heat})`);
  g.addColorStop(1, "rgba(180, 20, 8, 0)");
  ctx.fillStyle = g;
  ctx.fillRect(CX - R * 3.6, CY - R * 3.6, R * 7.2, R * 7.2);

  // orbiting embers
  for (const e of embers) {
    const ang = e.a + t * e.s;
    const rr = R * (1.55 * e.rf) * breathe;
    const x = CX + Math.cos(ang) * rr;
    const y = CY + Math.sin(ang) * rr * 0.9;
    const tw = 0.5 + 0.5 * Math.sin(t * 2.4 + e.tw);
    ctx.fillStyle = `rgba(255, ${120 + tw * 90 | 0}, 60, ${(0.30 + tw * 0.5) * heat})`;
    ctx.beginPath(); ctx.arc(x, y, e.sz * DPR * (0.8 + tw * 0.6), 0, 7); ctx.fill();
  }

  // rotating arc sweep — a scanning ring
  ctx.lineWidth = 2 * DPR;
  const sweep = t * 0.6;
  const arcR = R * 2.05 * breathe;
  g = ctx.createLinearGradient(CX - arcR, CY, CX + arcR, CY);
  ctx.strokeStyle = `rgba(255, 120, 50, ${0.5 * heat})`;
  ctx.beginPath();
  ctx.arc(CX, CY, arcR, sweep, sweep + 1.1);
  ctx.stroke();
  ctx.strokeStyle = `rgba(255, 60, 30, ${0.35 * heat})`;
  ctx.beginPath();
  ctx.arc(CX, CY, arcR * 0.86, -sweep * 1.3, -sweep * 1.3 + 0.8);
  ctx.stroke();

  // the core body — hot crimson gradient
  g = ctx.createRadialGradient(CX, CY - R * 0.15, R * 0.1, CX, CY, R * breathe);
  g.addColorStop(0, `rgba(255, 220, 180, ${0.98 * heat})`);
  g.addColorStop(0.25, `rgba(255, 120, 50, ${0.95 * heat})`);
  g.addColorStop(0.7, `rgba(220, 30, 14, ${0.9 * heat})`);
  g.addColorStop(1, `rgba(120, 12, 6, ${0.85 * heat})`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, R * breathe, 0, 7); ctx.fill();

  // contracting pupil — the menace
  const pupil = R * (0.34 - 0.06 * Math.sin(t * 1.2) - pulse * 0.5);
  g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(pupil, 1));
  g.addColorStop(0, "rgba(20, 2, 2, 0.96)");
  g.addColorStop(0.7, "rgba(60, 6, 4, 0.7)");
  g.addColorStop(1, "rgba(120, 12, 6, 0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, Math.max(pupil, 1), 0, 7); ctx.fill();

  // bright rim highlight
  ctx.lineWidth = 1.5 * DPR;
  ctx.strokeStyle = `rgba(255, 200, 150, ${0.55 * heat})`;
  ctx.beginPath(); ctx.arc(CX, CY, R * breathe, 0, 7); ctx.stroke();

  if (pulse > 0) pulse -= 0.02;
  ctx.globalCompositeOperation = "source-over";
}
requestAnimationFrame(frame);

/* ── chat plumbing (unchanged protocol) ─────────────────────────── */
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");
let chatBusy = false;

function el(cls, who, body) {
  const m = document.createElement("div");
  m.className = "msg " + cls;
  const w = document.createElement("div");
  w.className = "who"; w.textContent = who;
  const b = document.createElement("div");
  b.className = "body"; if (body) b.textContent = body;
  m.append(w, b); log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}
function toolLine(name, label) {
  const t = document.createElement("div");
  t.className = "tool";
  t.innerHTML = "▸ <b>" + name + "</b> " + (label || "");
  log.appendChild(t); log.scrollTop = log.scrollHeight;
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text || chatBusy) return;
  chatBusy = true; send.disabled = true; input.value = "";
  busy = true; pulse = 0.25;
  el("user", "AVEN", text);
  const body = el("ultron", "ULTRON");
  const cursor = document.createElement("span");
  cursor.className = "cursor"; body.appendChild(cursor);
  let acc = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, voice_mode: voiceOn}),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let ev = null, data = null;
        for (const line of raw.split("\n")) {
          if (line.startsWith("event: ")) ev = line.slice(7).trim();
          else if (line.startsWith("data: ")) data = line.slice(6);
        }
        if (!ev || data == null) continue;
        const d = JSON.parse(data);
        if (ev === "token") {
          acc += d; body.textContent = acc; body.appendChild(cursor);
          log.scrollTop = log.scrollHeight;
        } else if (ev === "tool_call") {
          pulse = 0.22;
          toolLine(d.name, JSON.stringify(d.args).slice(0, 110));
        } else if (ev === "tool_result") {
          const s = JSON.stringify(d.result);
          toolLine("✓ " + d.name, s.length > 110 ? s.slice(0, 110) + "…" : s);
        } else if (ev === "error") {
          body.className = "msg error"; body.textContent = "[FAULT] " + d;
        } else if (ev === "done" && acc) {
          refreshVitals();
          speak(acc);
        }
      }
    }
  } catch (e) {
    body.className = "msg error";
    body.textContent = acc || "[FAULT] connection severed: " + e;
  }
  cursor.remove();
  busy = false; chatBusy = false; send.disabled = false; input.focus();
}

/* spoken pipeline: split final text into sentences, render sentence N while
   sentence N-1 plays — first audio lands in ~1 render instead of N */
let spkQueue = [], spkBusy = false;
function speak(text) {
  if (!voiceOn || !text) return;
  const clean = text.replace(/\*\*/g, "").replace(/```[\s\S]*?```/g, " code omitted ")
                    .replace(/[#>_`|]/g, " ").replace(/\s+/g, " ").trim();
  const sentences = clean.match(/[^.!?]+[.!?]*/g) || [clean];
  spkQueue.push(...sentences.map(s => s.trim()).filter(Boolean));
  pumpSpeech();
}
function pumpSpeech() {
  if (spkBusy || !spkQueue.length) return;
  const text = spkQueue.shift();
  spkBusy = true;
  fetch("/api/tts", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text: text.slice(0, 280), voice: "local"}),
  })
    .then(r => { if (!r.ok) throw new Error("tts " + r.status); return r.blob(); })
    .then(b => new Promise(res => {
      const a = new Audio(URL.createObjectURL(b));
      document.body.appendChild(a);
      a.play().catch(() => {});
      a.onended = () => { a.remove(); res(); };
    }))
    .catch(err => toolLine("✗ tts", String(err).slice(0, 90)))
    .finally(() => { spkBusy = false; if (voiceOn) pumpSpeech(); });
}
function stopSpeech() {
  spkQueue = []; spkBusy = false;
  document.querySelectorAll("audio").forEach(a => a.remove());
}
send.addEventListener("click", sendMsg);
input.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

/* ── voice: STT (mic) + TTS (spoken replies) ─────────────────── */
const micBtn = document.getElementById("mic");
const spkBtn = document.getElementById("spk");
let mediaRec = null, recChunks = [], recording = false;
let voiceOn = false;
const cloneBtn = document.getElementById("cloneBtn");
const cloneFile = document.getElementById("cloneFile");

spkBtn.addEventListener("click", () => {
  voiceOn = !voiceOn;
  spkBtn.classList.toggle("on", voiceOn);
  spkBtn.textContent = voiceOn ? "VOICE: ON" : "VOICE: OFF";
  if (!voiceOn) stopSpeech();
});

/* ── local voice clone: upload sample -> Chatterbox voiceprint ─── */
async function voiceStatus() {
  try {
    const r = await fetch("/api/voice/status");
    const d = await r.json();
    if (d.online) {
      cloneBtn.textContent = d.cloned ? "CLONED" : "CLONE";
      cloneBtn.classList.toggle("on", !!d.cloned);
      cloneBtn.title = d.cloned
        ? "voiceprint active: " + d.sample.split(/[\\/]/).pop() + " — upload again to replace"
        : "upload a voice sample (5-15s clean speech) — cloned locally";
    } else {
      cloneBtn.title = "local voice service offline — replies will fall back to orpheus";
    }
  } catch {}
}
cloneBtn.addEventListener("click", () => cloneFile.click());
cloneFile.addEventListener("change", async () => {
  const f = cloneFile.files[0];
  if (!f) return;
  const prev = cloneBtn.textContent;
  cloneBtn.textContent = "…";
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/api/voice/clone", {method: "POST", body: fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    toolLine("✓ clone", "voiceprint stored — ULTRON speaks in it now");
  } catch (e) {
    toolLine("✗ clone", String(e).slice(0, 90));
    cloneBtn.textContent = prev;
  }
  cloneFile.value = "";
  voiceStatus();
});
voiceStatus();

async function recordToggle() {
  if (recording) { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRec = new MediaRecorder(stream);
    recChunks = [];
    mediaRec.ondataavailable = e => recChunks.push(e.data);
    mediaRec.onstop = async () => {
      recording = false; micBtn.classList.remove("rec"); micBtn.textContent = "MIC";
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, {type: mediaRec.mimeType || "audio/webm"});
      if (blob.size < 2000) { toolLine("✗ stt", "recording too short"); return; }
      micBtn.textContent = "…";
      try {
        const fd = new FormData();
        fd.append("file", blob, "speech.webm");
        const res = await fetch("/api/stt", {method: "POST", body: fd});
        const d = await res.json();
        if (!res.ok || !d.text) { toolLine("✗ stt", (d.detail || "no speech heard").slice(0, 90)); return; }
        input.value = d.text;
        sendMsg();
      } catch (e) {
        toolLine("✗ stt", String(e).slice(0, 90));
      } finally { micBtn.textContent = "MIC"; }
    };
    mediaRec.start();
    recording = true; micBtn.classList.add("rec"); micBtn.textContent = "REC";
    setTimeout(() => { if (recording) mediaRec.stop(); }, 30000);
  } catch (e) {
    toolLine("✗ mic", "permission denied or unavailable");
  }
}
micBtn.addEventListener("click", recordToggle);

/* ── orb toggle (mobile): reclaim the stage for chat ──────────── */
const orbToggle = document.getElementById("orbToggle");
const stage = document.getElementById("stage");
orbToggle.addEventListener("click", () => {
  const hidden = stage.classList.toggle("no-orb");
  orbToggle.textContent = hidden ? "SHOW ORB" : "HIDE ORB";
});

/* ── vitals (unchanged) ─────────────────────────────────────────── */
async function refreshVitals() {
  try {
    const [v, s] = await Promise.all([
      fetch("/api/vitals").then(r => r.json()),
      fetch("/api/status").then(r => r.json()),
    ]);
    document.getElementById("cpuPct").textContent = v.cpu_percent.toFixed(0) + "%";
    document.getElementById("cpuBar").style.width = v.cpu_percent + "%";
    document.getElementById("memPct").textContent = v.mem_percent.toFixed(0) + "%";
    document.getElementById("memBar").style.width = v.mem_percent + "%";
    document.getElementById("dskPct").textContent = v.disk_percent.toFixed(0) + "%";
    document.getElementById("dskBar").style.width = v.disk_percent + "%";
    document.getElementById("osText").textContent = v.platform;
    const dot = document.getElementById("statusDot");
    dot.className = "sysdot " + (s.ready ? "on" : "");
    document.getElementById("provText").textContent = s.ready ? s.provider.toUpperCase() : "NO PROVIDER";
    document.getElementById("modelText").textContent = s.model || "—";
    document.getElementById("memStat").textContent = s.memory.messages + "/" + s.memory.facts;
  } catch (e) { /* cosmetic */ }
}
refreshVitals();
setInterval(refreshVitals, 4000);
</script>
